# Everyday build + test feedback. Runs on every push to main and
# every PR.
#
# LLVM is a released version installed from apt.llvm.org (see
# .github/actions/setup-llvm), so there is no LLVM build step: the dev package
# drops in within a minute and only Dragon itself compiles here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# FYI - A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Linux build + test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build deps
        run: |
          sudo apt-get update
          # zlib/zstd are REQUIRED by Dragon's CMake (find_package/find_library).
          sudo apt-get install -y cmake ninja-build zlib1g-dev libzstd-dev

      - name: Setup LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDRAGON_BUILD_TESTS=ON \
            -DLLVM_DIR="${{ steps.llvm.outputs.llvm-dir }}"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Main-branch pushes hand their build to the Deploy workflow so the
      # Hetzner box always runs exactly the compiler that passed these tests.
      - name: Package .deb for deploy (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: build
        run: cpack -G DEB -B "$PWD/dist"

      - name: Upload .deb artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragon-deb
          path: build/dist/*.deb
          retention-days: 7
          if-no-files-found: error

  build-test-macos:
    name: macOS build + test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build deps
        run: brew install cmake ninja zstd

      - name: Setup LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDRAGON_BUILD_TESTS=ON \
            -DLLVM_DIR="${{ steps.llvm.outputs.llvm-dir }}"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan:
    name: ASan dr tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev libzstd-dev

      - name: Setup LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm

      - name: Configure (instrumented runtime)
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDRAGON_BUILD_TESTS=ON \
            -DDRAGON_ASAN=ON \
            -DLLVM_DIR="${{ steps.llvm.outputs.llvm-dir }}"

      - name: Build
        run: cmake --build build-asan -j

      # RSS cap instead of ulimit -v: ASan reserves ~20TB of virtual address
      # space and aborts at startup under an address-space limit. 4000MB: the
      # alloc-bounds/oom-probe tests peak near 3.5GB under ASan overhead and
      # spuriously rss-abort at 2048.
      # dr_oom_* excluded: they run compiled programs under ulimit -v by design,
      # which an ASan-instrumented binary cannot survive.
      # detect_leaks=1 across the whole suite: the raise-path temp-leak family
      # (issue-3) is fixed, so any leak here is a regression.
      # allocator_may_return_null=1: the alloc-bounds tests probe huge requests
      # that must return NULL so the runtime raises MemoryError; without it
      # ASan hard-aborts on allocation-size-too-big.
      - name: Run dr tests under ASan with leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:allocator_may_return_null=1:hard_rss_limit_mb=4000
        run: ctest --test-dir build-asan -R '^dr_' -E '^dr_oom_' --output-on-failure

  llvm-floor:
    name: LLVM 21 floor build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev libzstd-dev

      # Everything else builds against the default major (22); this job pins
      # the documented floor so a 21-only API break cannot land unnoticed.
      - name: Setup LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm
        with:
          llvm-major: '21'

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDRAGON_BUILD_TESTS=OFF \
            -DLLVM_DIR="${{ steps.llvm.outputs.llvm-dir }}"

      - name: Build
        run: cmake --build build -j

      - name: Smoke check
        run: ./build/dragon check examples/hello.dr

  freebsd:
    name: FreeBSD build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # New platform: report status without blocking merges yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build + test in FreeBSD VM
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg install -y cmake ninja git python3 llvm21 zstd
          run: |
            # `set -e` is needed for failures to register. https://github.com/vmactions/freebsd-vm/issues/72
            set -e -x
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DDRAGON_BUILD_TESTS=ON \
              -DLLVM_DIR="$(llvm-config21 --cmakedir)"
            cmake --build build -j
            ctest --test-dir build --output-on-failure

