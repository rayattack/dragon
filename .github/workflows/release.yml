# Dragon release pipeline.
#
# Builds the compiler on Linux, macOS (Apple Silicon + Intel) and Windows
# (MSYS2/UCRT64, marked experimental).
#
# Triggers:
#   * If you push a tag like `v0.0.1`            -> publishes a release for that tag
#   * manual "Run workflow" (workflow_dispatch) with a tag input -> same
#
# Asset naming (consumed verbatim by www.dr):
#   dragon-<ver>-linux-x86_64.{deb,rpm,tar.gz}
#   dragon-<ver>-macos-arm64.tar.gz
#   dragon-<ver>-macos-x86_64.tar.gz
#   dragon-<ver>-windows-x86_64.zip
#
# LLVM: the codebase builds against a released LLVM (>= 21). The reusable
# .github/actions/setup-llvm installs it from apt.llvm.org (Linux), Homebrew
# (macOS) or MSYS2 (Windows). On Linux and macOS LLVM is statically linked, so
# the .deb/.rpm/.tar.gz do not depend on a system libLLVM. Windows links the
# libLLVM DLL instead -- ld cannot digest the static component archives -- so
# the .zip carries that DLL and the rest of the MinGW runtime in bin/.
#

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write          # create the release + upload assets

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # One bad platform shouldn't sink the others; partial releases are fine.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13/14 are retired/deprecated on GitHub; macos-15-intel is
          # the only remaining free x64 macOS label.
          - { os: ubuntu-22.04,     target: linux-x86_64,  experimental: false }
          - { os: macos-15,         target: macos-arm64,   experimental: false }
          - { os: macos-15-intel,   target: macos-x86_64,  experimental: false }
          # Windows builds under MSYS2/UCRT64, never MSVC: the runtime is
          # written against pthreads/unistd.h. Experimental until the test
          # suite is fully green on the platform.
          - { os: windows-2025,     target: windows-x86_64, experimental: true }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ---- Resolve the version from the tag (strip the leading 'v') ----------
      - name: Resolve version
        id: ver
        shell: bash
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"   >> "$GITHUB_OUTPUT"
          echo "Building Dragon $VER"

      # Refuse to build a release whose tag disagrees with dragon::VERSION.
      - name: Version guard (tag vs include/dragon.h)
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          SRC="$(grep 'constexpr const char\* VERSION' include/dragon.h | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ "$SRC" != "$VER" ]; then
            echo "tag says $VER but include/dragon.h says $SRC" >&2
            exit 1
          fi
          echo "version check passed: $VER"

      # ---- Toolchain ---------------------------------------------------------
      - name: Install build + packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # rpm: cpack RPM generator; file/dpkg-dev: deb metadata; zlib/zstd:
          # REQUIRED by Dragon's CMake (find_package/find_library).
          sudo apt-get install -y cmake ninja-build rpm file dpkg-dev zlib1g-dev libzstd-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja zstd

      # UCRT64 supplies GCC (winpthreads), CMake, Ninja and zlib/zstd. No WiX:
      # Windows ships as a ZIP that already carries its DLLs.
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p cmake:p ninja:p zlib:p zstd:p

      # ---- LLVM (pinned trunk snapshot, built once + cached) -----------------
      - name: Setup LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm

      # ---- Configure + build -------------------------------------------------
      # macOS legs build with tests ON and run the suite before packaging;
      # the Linux leg is already gated by the everyday CI workflow.
      - name: Configure
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDRAGON_BUILD_TESTS=${{ runner.os == 'macOS' && 'ON' || 'OFF' }} \
            -DLLVM_DIR="${{ steps.llvm.outputs.llvm-dir }}"

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --config Release -j

      # Windows gets its own pair: the toolchain lives inside MSYS2, and the
      # runner's stock `bash` (Git Bash) cannot see it.
      - name: Configure + build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDRAGON_BUILD_TESTS=OFF \
            -DLLVM_DIR="${{ steps.llvm.outputs.llvm-dir }}"
          cmake --build build -j

      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ctest --test-dir build --output-on-failure

      # ---- Verify the binaries are self-contained (macOS) --------------------
      # Fail the release if a binary links any non-system library by absolute
      # path (v0.0.1 shipped that way and aborted on Macs without Homebrew).
      - name: Verify self-contained binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for bin in build/dragon build/dragon-egg; do
            otool -L "$bin"
            if otool -L "$bin" | grep -E '/opt/homebrew|/usr/local/(opt|Cellar|lib)'; then
              echo "$bin links non-system libraries by absolute path" >&2
              exit 1
            fi
          done
          ./build/dragon --version

      # ---- Package -----------------------------------------------------------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        run: |
          cpack -G DEB -B "$PWD/dist"
          cpack -G RPM -B "$PWD/dist"
          cpack -G TGZ -B "$PWD/dist"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: build
        run: |
          # No .dmg: macOS installs go through install.sh (curl), which avoids
          # the Gatekeeper quarantine an unsigned disk image would carry.
          cpack -G TGZ -B "$PWD/dist"

      # The install step resolves dragon.exe's runtime DLLs (libLLVM, libstdc++,
      # libwinpthread, ...) out of the MSYS2 bin dir and drops them in bin/, so
      # the archive runs on a machine that has never seen MSYS2.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: msys2 {0}
        run: cpack -G ZIP -B "$PWD/dist"

      # Mirror of the macOS check: unpack somewhere neutral, scrub MSYS2 off
      # PATH, and confirm the binary still starts.
      - name: Verify self-contained binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP/pkgtest" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP/pkgtest" -Recurse -Filter dragon.exe | Select-Object -First 1
          if (-not $exe) { throw "no dragon.exe inside $($zip.Name)" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "dragon.exe did not run without MSYS2 on PATH" }

      # ---- Normalize artifact names to what www.dr links to ------------------
      - name: Rename artifacts
        id: rename
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
          T: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          pick() {  # pick <glob> <dest-extension>
            local g="$1" ext="$2"
            local files=( build/dist/*.$g )
            if [ ${#files[@]} -eq 0 ]; then
              echo "no .$g produced (skipping)"; return 0
            fi
            cp "${files[0]}" "out/dragon-${VER}-${T}.${ext}"
            echo "  -> dragon-${VER}-${T}.${ext}"
          }
          case "$T" in
            linux-*)   pick deb deb;    pick rpm rpm;    pick "tar.gz" "tar.gz" ;;
            macos-*)                                     pick "tar.gz" "tar.gz" ;;
            windows-*)                                   pick zip zip ;;
          esac
          # Checksums alongside each artifact.
          ( cd out && for f in *; do
              if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256";
              else shasum -a 256 "$f" > "$f.sha256"; fi
            done )
          ls -la out

      # Every tarball must work cold: unpack somewhere neutral, then compile
      # and run a hello world with the unpacked binary.
      - name: Smoke test tarball
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
          T: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tb="out/dragon-${VER}-${T}.tar.gz"
          if [ ! -f "$tb" ]; then
            echo "no tarball for $T, nothing to smoke test"
            exit 0
          fi
          dir="$(mktemp -d)"
          tar -xzf "$tb" -C "$dir"
          bin="$(find "$dir" -type f -path '*/bin/dragon' | head -1)"
          if [ -z "$bin" ]; then
            echo "no bin/dragon inside $tb" >&2
            exit 1
          fi
          echo 'print("hello, world")' > "$dir/hello.dr"
          "$bin" run "$dir/hello.dr" | grep -q "hello, world"
          echo "smoke test passed for $tb"

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Dragon ${{ steps.ver.outputs.version }}
          draft: true                # review before going public
          fail_on_unmatched_files: false
          files: out/*
