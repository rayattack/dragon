# Provide the LLVM that Dragon links against.
#
# 
# Dragon builds against a RELEASED LLVM (>= 21; see the floor check in the root
# CMakeLists.txt). On every platform that is now a one-shot package install, so
# the old "build LLVM from source and cache it" dance (45-90 min on a cold
# cache) is gone everywhere.
#
#   * Linux  -> apt.llvm.org dev package  (llvm-<major>-dev),              ~1 min
#   * macOS  -> Homebrew                  (llvm@<major>),                ~1-2 min
#   * Windows-> MSYS2/UCRT64              (mingw-w64-ucrt-x86_64-llvm),  ~1-2 min
#
# The Windows entry used to build from source on the belief that no Windows
# package ships LLVM with the CMake config Dragon links against. That is not
# true of MSYS2: its mingw-w64-llvm runs a full `cmake --install`, so
# lib/cmake/llvm/LLVMConfig.cmake and the libLLVM import library are both there.
#
# The output `llvm-dir` is the directory holding LLVMConfig.cmake; pass it as
# -DLLVM_DIR=. To move onto a newer LLVM, bump `llvm-major` (and confirm the
# CMakeLists floor still holds, and that MSYS2 has caught up).
#

name: 'Setup LLVM'
description: 'Install the released LLVM Dragon links against (apt.llvm.org / Homebrew / MSYS2)'

inputs:
  llvm-major:
    description: 'LLVM major version to provide (a released series, >= 21)'
    required: false
    default: '22'

outputs:
  llvm-dir:
    description: 'Path to the LLVMConfig.cmake directory (pass as -DLLVM_DIR=)'
    value: ${{ steps.linux.outputs.llvm-dir || steps.macos.outputs.llvm-dir || steps.windows.outputs.llvm-dir }}

runs:
  using: composite
  steps:
    # ---- Linux: apt.llvm.org -------------------------------------------------
    - name: Install LLVM (Linux)
      id: linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euxo pipefail
        MAJOR="${{ inputs.llvm-major }}"
        CODENAME="$(. /etc/os-release; echo "$VERSION_CODENAME")"
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${MAJOR} main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y "llvm-${MAJOR}-dev"
        echo "llvm-dir=$(llvm-config-${MAJOR} --cmakedir)" >> "$GITHUB_OUTPUT"

    # ---- macOS: Homebrew -----------------------------------------------------
    - name: Install LLVM (macOS)
      id: macos
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        MAJOR="${{ inputs.llvm-major }}"
        brew install "llvm@${MAJOR}"
        PREFIX="$(brew --prefix "llvm@${MAJOR}")"
        echo "llvm-dir=${PREFIX}/lib/cmake/llvm" >> "$GITHUB_OUTPUT"

    # ---- Windows: MSYS2/UCRT64 package ---------------------------------------
    # mingw-w64-ucrt-x86_64-llvm ships the headers, LLVMConfig.cmake and the
    # libLLVM import library, so there is nothing to build here. The calling job
    # must run msys2/setup-msys2 first: that provides pacman and registers the
    # `msys2 {0}` shell used below.
    - name: Install LLVM (Windows)
      id: windows
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        MAJOR="${{ inputs.llvm-major }}"
        pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-llvm
        HAVE="$(llvm-config --version | cut -d. -f1)"
        # MSYS2 carries one LLVM series at a time. Fail loudly rather than
        # silently building against a major the CMakeLists floor did not expect.
        if [ "$HAVE" != "$MAJOR" ]; then
          echo "::error::MSYS2 ships LLVM ${HAVE}, but llvm-major is ${MAJOR}"
          exit 1
        fi
        echo "llvm-dir=$(cygpath -m "$(llvm-config --cmakedir)")" >> "$GITHUB_OUTPUT"
